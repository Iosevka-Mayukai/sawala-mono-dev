name: Patch Nerd Font

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag to patch (e.g. v1.0.0, or latest)'
        required: true
        default: 'latest'
        type: string
      variant:
        description: 'Variant to patch (matches build.yml)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - SawalaMono
          - SawalaMonoNL
      patch_mode:
        description: 'Nerd Font patch preset'
        required: true
        default: 'complete'
        type: choice
        options:
          - complete
          - default
      font_scope:
        description: 'Font scope to patch'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - extended-core
          - all
      custom_name:
        description: 'Optional custom font family name override (e.g. "Sawala Mono NF", or leave empty for auto)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  patch:
    name: Patch Font with Nerd Fonts Patcher
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Target Release Tag
        id: resolve-tag
        env:
          INPUT_TAG_RAW: ${{ github.event.inputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          INPUT_TAG="${INPUT_TAG_RAW:-latest}"
          if [ "$INPUT_TAG" = "latest" ]; then
            RESOLVED_TAG=$(gh release view --json tagName -q .tagName)
            if [ -z "$RESOLVED_TAG" ]; then
              echo "::error::No existing GitHub release found to patch."
              exit 1
            fi
          else
            RESOLVED_TAG="$INPUT_TAG"
            if ! gh release view "$RESOLVED_TAG" --json tagName >/dev/null 2>&1; then
              echo "::error::Target release tag '$RESOLVED_TAG' not found."
              exit 1
            fi
          fi

          echo "Target Release Tag: $RESOLVED_TAG"
          echo "target_tag=$RESOLVED_TAG" >> $GITHUB_OUTPUT

      - name: Download & Extract Base Release Archive
        env:
          TARGET_TAG: ${{ steps.resolve-tag.outputs.target_tag }}
          VARIANT_RAW: ${{ github.event.inputs.variant }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VARIANT="${VARIANT_RAW:-all}"
          mkdir -p raw_archives in_raw in out archives

          echo "Downloading base font archives for release: $TARGET_TAG (Variant: $VARIANT)"
          gh release download "$TARGET_TAG" --pattern "*SawalaMono*.zip" --dir raw_archives

          # Exclude any previously uploaded Nerd Font patched archives
          rm -f raw_archives/*NF*.zip raw_archives/*-NF-*.zip

          # Filter base archives by selected variant
          if [ "$VARIANT" = "SawalaMono" ]; then
            rm -f raw_archives/*SawalaMonoNL*.zip
          elif [ "$VARIANT" = "SawalaMonoNL" ]; then
            find raw_archives -type f -name "*.zip" ! -name "*SawalaMonoNL*.zip" -delete
          fi

          ZIP_COUNT=$(find raw_archives -name "*.zip" | wc -l)
          if [ "$ZIP_COUNT" -eq 0 ]; then
            echo "::error::No base zip archive found for variant '$VARIANT' in release $TARGET_TAG."
            exit 1
          fi

          echo "Extracting base font archives..."
          for z in raw_archives/*.zip; do
            echo "Unzipping $z..."
            unzip -q -o "$z" -d in_raw/
          done

          # Exclude intermediate unhinted TTF directories generated by build.yml when hinted TTF directories exist
          if [ -n "$(find in_raw -type d -name 'TTF')" ]; then
            echo "Removing intermediate TTF-Unhinted directories (keeping hinted TTFs)..."
            find in_raw -type d -name "TTF-Unhinted" -exec rm -rf {} +
          fi

      - name: Filter Font Scope
        env:
          SCOPE_RAW: ${{ github.event.inputs.font_scope }}
          VARIANT_RAW: ${{ github.event.inputs.variant }}
        run: |
          SCOPE="${SCOPE_RAW:-core}"
          VARIANT="${VARIANT_RAW:-all}"
          echo "Selected Font Scope: $SCOPE | Variant: $VARIANT"

          if [ "$VARIANT" = "all" ]; then
            VARIANTS=("SawalaMono" "SawalaMonoNL")
          else
            VARIANTS=("$VARIANT")
          fi

          CORE_SUFFIXES=(
            "-Regular.ttf"
            "-Italic.ttf"
            "-Medium.ttf"
            "-MediumItalic.ttf"
            "-SemiBold.ttf"
            "-SemiBoldItalic.ttf"
            "-Bold.ttf"
            "-BoldItalic.ttf"
          )

          EXTENDED_SUFFIXES=(
            "-SemiExtended.ttf"
            "-SemiExtendedItalic.ttf"
            "-SemiExtendedMedium.ttf"
            "-SemiExtendedMediumItalic.ttf"
            "-SemiExtendedSemiBold.ttf"
            "-SemiExtendedSemiBoldItalic.ttf"
            "-SemiExtendedBold.ttf"
            "-SemiExtendedBoldItalic.ttf"
          )

          for v in "${VARIANTS[@]}"; do
            if [ -z "$(find in_raw -type f -name "${v}-*.ttf")" ]; then
              echo "Skipping variant $v (no extracted TTF files found in release)."
              continue
            fi

            mkdir -p "in/$v"
            if [ "$SCOPE" = "core" ]; then
              echo "[$v] Filtering core coding weights (Normal width)..."
              for sfx in "${CORE_SUFFIXES[@]}"; do
                find in_raw -type f -name "${v}${sfx}" -exec cp {} "in/$v/" \;
              done
            elif [ "$SCOPE" = "extended-core" ]; then
              echo "[$v] Filtering extended coding weights (SemiExtended width)..."
              for sfx in "${EXTENDED_SUFFIXES[@]}"; do
                find in_raw -type f -name "${v}${sfx}" -exec cp {} "in/$v/" \;
              done
            else
              echo "[$v] Selecting all extracted TrueType font files..."
              find in_raw -type f -name "${v}-*.ttf" -exec cp {} "in/$v/" \;
            fi
          done

          STAGED_COUNT=$(find in -type f -name "*.ttf" | wc -l)
          echo "Total fonts staged for patching: $STAGED_COUNT"
          if [ "$STAGED_COUNT" -eq 0 ]; then
            echo "::error::Zero TrueType (.ttf) font files found to patch. Ensure the release was built with format 'ttf' or 'contents'."
            exit 1
          fi

          echo "Staged font inventory:"
          ls -lh in/*/

      - name: Run Containerized Nerd Font Patcher
        env:
          PATCH_MODE_RAW: ${{ github.event.inputs.patch_mode }}
          VARIANT_RAW: ${{ github.event.inputs.variant }}
          CUSTOM_NAME_RAW: ${{ github.event.inputs.custom_name }}
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          PATCH_MODE="${PATCH_MODE_RAW:-complete}"
          VARIANT="${VARIANT_RAW:-all}"
          CUSTOM_NAME="${CUSTOM_NAME_RAW:-}"
          echo "Selected Patch Mode: $PATCH_MODE"

          for in_dir in in/*/; do
            [ -d "$in_dir" ] || continue
            v=$(basename "$in_dir")
            mkdir -p "out/$v"

            PATCH_ARGS=("--mono")
            if [ "$PATCH_MODE" = "complete" ]; then
              PATCH_ARGS+=("--complete")
            fi

            if [ -n "$CUSTOM_NAME" ]; then
              VARIANT_CUSTOM_NAME="$CUSTOM_NAME"
              if [ "$VARIANT" = "all" ] && [ "$v" = "SawalaMonoNL" ] && [[ "$CUSTOM_NAME" != *"NL"* ]]; then
                if [[ "$CUSTOM_NAME" == *" NF" ]]; then
                  VARIANT_CUSTOM_NAME="${CUSTOM_NAME% NF} NL NF"
                else
                  VARIANT_CUSTOM_NAME="${CUSTOM_NAME} NL"
                fi
              fi
              echo "[$v] Custom Font Name Override: $VARIANT_CUSTOM_NAME"
              PATCH_ARGS+=("--name" "$VARIANT_CUSTOM_NAME")
            fi

            echo "[$v] Running nerdfonts/patcher Docker container with PN=2 and arguments: ${PATCH_ARGS[*]}..."
            docker run --rm \
              -v "$WORKSPACE_PATH/in/$v:/in" \
              -v "$WORKSPACE_PATH/out/$v:/out" \
              -e "PN=2" \
              nerdfonts/patcher:latest \
              "${PATCH_ARGS[@]}"
          done

      - name: Fix Workspace Permissions
        if: always()
        env:
          WORKSPACE_PATH: ${{ github.workspace }}
        run: |
          sudo chown -R $USER:$USER "$WORKSPACE_PATH"

      - name: Verify Patched Output & Package Archive
        env:
          TARGET_TAG: ${{ steps.resolve-tag.outputs.target_tag }}
          SCOPE_RAW: ${{ github.event.inputs.font_scope }}
        run: |
          PATCHED_COUNT=$(find out -type f -name "*.ttf" | wc -l)
          echo "Total patched fonts generated: $PATCHED_COUNT"

          if [ "$PATCHED_COUNT" -eq 0 ]; then
            echo "::error::Docker patcher did not produce any .ttf font files."
            exit 1
          fi

          SCOPE="${SCOPE_RAW:-core}"
          mkdir -p archives

          for out_dir in out/*/; do
            [ -d "$out_dir" ] || continue
            v=$(basename "$out_dir")
            v_count=$(find "$out_dir" -type f -name "*.ttf" | wc -l)
            if [ "$v_count" -eq 0 ]; then
              echo "::error::No patched .ttf files generated for variant $v."
              exit 1
            fi

            if [ "$SCOPE" = "extended-core" ]; then
              ARCHIVE_NAME="${v}-Extended-NF-${TARGET_TAG}.zip"
            else
              ARCHIVE_NAME="${v}-NF-${TARGET_TAG}.zip"
            fi

            echo "[$v] Packaging $v_count patched fonts into archives/${ARCHIVE_NAME}..."
            (cd "$out_dir" && zip -r "../../archives/${ARCHIVE_NAME}" *.ttf)
          done

          echo "Generated release archives:"
          ls -lh archives/

      - name: Upload Font Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sawala-Mono-NF-Packages
          path: archives/*.zip
          if-no-files-found: error

      - name: Upload Nerd Font Archive to GitHub Release
        env:
          TARGET_TAG: ${{ steps.resolve-tag.outputs.target_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading archives/*.zip to GitHub Release $TARGET_TAG..."
          gh release upload "$TARGET_TAG" archives/*.zip --clobber
