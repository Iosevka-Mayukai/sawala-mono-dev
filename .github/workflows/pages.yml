name: Deploy Sawala Mono Showcase to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "web-docs/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage static showcase artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll sawala-mono-hero-img.jpg _site/
          cp -r web-docs _site/web-docs

      - name: Upload static showcase artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
