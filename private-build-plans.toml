# Configuration for Iosevka Sawala Mono
# Reference: https://github.com/be5invis/Iosevka/blob/master/doc/custom-build.md

[buildPlans.SawalaMono]
family = "Sawala Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false
noLigation = true

[buildPlans.SawalaMono.variants.design]
one = "no-base"
eight = "two-circles"
nine = "straight-bar"
zero = "reverse-slashed"
capital-b = "more-asymmetric-serifless"
capital-g = "flat-bottom-serifless-hooked"
capital-u = "toothless-rounded-serifless"
a = "double-storey-flat-bottom-serifless"
b = "flat-bottom-serifless"
d = "flat-bottom-serifless"
f = "flat-hook-serifless"
g = "double-storey"
i = "serifed"
k = "straight-serifless"
l = "serifed"
m = "earless-corner-double-arch-serifless"
n = "earless-corner-straight-serifless"
p = "flat-top-serifless"
q = "flat-top-straight-serifless"
r = "serifed"
t = "flat-hook"
u = "toothless-rounded-serifless"
y = "straight-turn-serifless"
ampersand = "upper-open"
at = "threefold"
dollar = "through"
percent = "rings-continuous-slash"

[buildPlans.SawalaMono.variants.italic]
one = "no-base"
nine = "open-contour"
zero = "reverse-slashed"
capital-b = "standard-serifless"
capital-g = "flat-bottom-serifless-hooked"
capital-u = "toothless-rounded-serifless"
a = "single-storey-earless-corner-tailed"
b = "flat-bottom-serifless"
c = "serifless"
d = "flat-bottom-serifless"
f = "flat-hook-tailed"
g = "single-storey-flat-top-serifless"
i = "tailed-serifed"
j = "serifless"
k = "cursive-serifless"
l = "serifed-semi-tailed"
m = "earless-corner-double-arch-serifless"
n = "earless-rounded-straight-serifless"
p = "flat-top-serifless"
q = "flat-top-straight-serifless"
r = "serifless"
t = "flat-hook"
u = "toothless-rounded-serifless"
y = "cursive-serifless"

[buildPlans.SawalaMono.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.SawalaMono.widths.SemiExtended]
shape = 548
menu = 6
css = "semi-expanded"

[buildPlans.SawalaMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.SawalaMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
